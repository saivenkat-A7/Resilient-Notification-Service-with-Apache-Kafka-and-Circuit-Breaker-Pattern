# One-command setup:  docker compose up --build -d
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Zookeeper"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - notification-net

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # kafka:29092 -> other containers, localhost:9092 -> your host machine
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1 # For simpler local testing
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - notification-net

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      # The mock User Profile Service lives inside this same application
      USER_PROFILE_SERVICE_URL: ${USER_PROFILE_SERVICE_URL:-http://notification-service:8080/mock-users}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-notification_group}
      MOCK_USER_PROFILE_FAIL: ${MOCK_USER_PROFILE_FAIL:-false}
      MOCK_USER_PROFILE_DELAY_MS: ${MOCK_USER_PROFILE_DELAY_MS:-0}
      CB_SLIDING_WINDOW_SIZE: ${CB_SLIDING_WINDOW_SIZE:-10}
      CB_MINIMUM_NUMBER_OF_CALLS: ${CB_MINIMUM_NUMBER_OF_CALLS:-5}
      CB_FAILURE_RATE_THRESHOLD: ${CB_FAILURE_RATE_THRESHOLD:-50}
      CB_WAIT_DURATION_IN_OPEN_STATE: ${CB_WAIT_DURATION_IN_OPEN_STATE:-10s}
      CB_PERMITTED_CALLS_IN_HALF_OPEN: ${CB_PERMITTED_CALLS_IN_HALF_OPEN:-3}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - notification-net

networks:
  notification-net:
    driver: bridge
